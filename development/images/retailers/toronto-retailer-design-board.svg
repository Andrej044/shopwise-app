<text x="40" y="123" fill="#52635A" font-family="Inter, Arial, sans-serif" font-size="16">Choose product → compare stores → choose store → add to list</text>
<rect x="40" y="144" width="1120" height="40" rx="10" fill="#FFF4D6"/>
<text x="56" y="170" fill="#805500" font-family="Inter, Arial, sans-serif" font-size="14">STATIC DESIGN • Generic name badges, not retailer logos • No live prices or verified branch data</text>
<rect x="40" y="210" width="636" height="786" rx="22" fill="#FFFFFF" stroke="#D9E3DC"/>
<text x="56" y="249" fill="#13231C" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Compare this product</text>
<text x="56" y="279" fill="#13231C" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Product name · brand · pack size</text>
<text x="56" y="305" fill="#52635A" font-family="Inter, Arial, sans-serif" font-size="14">Select a store. Lowest-price labels require comparable current offers.</text>
