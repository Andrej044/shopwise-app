<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">Shopwise Toronto retailer design</title>
<desc id="desc">Static design board showing five retailer options, product comparison with unavailable prices, and an unpriced shopping-list item assigned to Metro. This is a visual layout only.</desc>
<rect width="1200" height="1040" fill="#F7F9F7"/>
<text x="40" y="56" fill="#126344" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Shopwise</text>
